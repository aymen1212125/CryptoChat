<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CryptoChat • Messages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="connectionBanner" class="connection-banner hidden" role="status" aria-live="polite">Reconnecting… Offline mode enabled.</div>

  <main class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Conversations sidebar">
      <header class="sidebar-head">
        <h2 id="meLabel">@me</h2>
        <div class="head-actions">
          <button id="themeBtn" class="icon-btn" type="button" aria-label="Toggle theme">◐</button>
          <button id="logoutBtn" class="icon-btn" type="button" aria-label="Logout">⇥</button>
        </div>
      </header>

      <div class="desktop-tabs" role="tablist" aria-label="Sidebar sections">
        <button class="tab-btn active" data-panel="chats" type="button">Chats</button>
        <button class="tab-btn" data-panel="search" type="button">Search</button>
        <button class="tab-btn" data-panel="invites" type="button">Invites</button>
      </div>

      <section id="chatsPanel" class="section-panel active" aria-label="Chats panel">
        <div class="section-head">
          <h3>Chats</h3>
          <button id="refreshBtn" class="icon-btn" type="button" aria-label="Refresh">↻</button>
        </div>
        <ul id="chatList" class="list"></ul>
      </section>

      <section id="searchPanel" class="section-panel" aria-label="Search panel">
        <h3>Search</h3>
        <input id="searchInput" class="input" placeholder="Search users" autocomplete="off" />
        <ul id="searchList" class="list"></ul>
      </section>

      <section id="invitesPanel" class="section-panel" aria-label="Invites panel">
        <h3>Invites</h3>
        <ul id="invitesList" class="list"></ul>
      </section>
    </aside>

    <section class="chat-pane" aria-label="Conversation area">
      <header class="chat-header">
        <button id="mobileBackBtn" class="icon-btn mobile-only" type="button" aria-label="Back">←</button>
        <div>
          <h3 id="chatTitle">Select a chat</h3>
          <small id="typingLabel" class="muted"></small>
        </div>
      </header>

      <div id="messagesViewport" class="messages-viewport">
        <div id="messagesInner" class="messages-inner"></div>
      </div>

      <div class="composer-wrap">
        <form id="composerForm" class="composer" aria-label="Message composer">
          <button id="plusBtn" class="icon-btn accent" type="button" aria-label="More actions">＋</button>
          <div id="uploadMenu" class="upload-menu hidden">
            <button id="uploadImageBtn" type="button">Image/File</button>
          </div>
          <input id="fileInput" type="file" accept="image/*" hidden />

          <textarea id="messageInput" class="composer-input" placeholder="Message..." rows="1"></textarea>

          <button id="sendBtn" class="send-btn" type="submit" aria-label="Send">➤</button>
        </form>
      </div>
    </section>

    <aside class="info-pane" aria-label="Conversation info">
      <h3>Info</h3>
      <div id="infoPanel" class="info-panel">
        <p class="muted">Pick a chat to view details and actions.</p>
      </div>
    </aside>
  </main>

  <nav id="mobileNav" class="mobile-nav" aria-label="Bottom navigation">
    <button class="nav-btn active" data-panel="chats" type="button">💬<span>Chat</span></button>
    <button class="nav-btn" data-panel="search" type="button">🔎<span>Search</span></button>
    <button class="nav-btn" data-panel="invites" type="button">👤<span>Invites</span></button>
  </nav>

  <div id="contextMenu" class="context-menu hidden" role="menu">
    <button type="button" data-action="reply">Reply</button>
    <button type="button" data-action="forward">Forward</button>
    <button type="button" data-action="edit">Edit</button>
  </div>

  <template id="messageTemplate">
    <article class="bubble" data-kind="single">
      <div class="bubble-meta"></div>
      <div class="bubble-content"></div>
      <div class="bubble-state"></div>
      <div class="bubble-time"></div>
      <div class="reactions" aria-hidden="true">😀 👍 ❤️</div>
    </article>
  </template>

  <script src="chat.js"></script>
</body>
</html>
