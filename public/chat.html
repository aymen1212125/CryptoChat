<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CryptoChat • Chat</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="chat-shell">
    <header class="chat-topbar glass">
      <div>
        <h2 id="chatTitle"></h2>
        <small id="subTitle" class="muted"></small>
      </div>
      <div class="row">
        <button id="backBtn" class="secondary small">Chats</button>
        <button id="logoutBtn" class="secondary small">Logout</button>
      </div>
    </header>

    <section class="chat-card glass">
      <div id="messages" class="messages"></div>
      <form id="messageForm" class="composer">
        <input id="messageInput" placeholder="Write a message..." maxlength="600" required />
        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <script src="chat.js"></script>
</body>
</html>
