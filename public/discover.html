<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CryptoChat • Chats</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <aside class="sidebar glass">
      <header class="sidebar-head">
        <h2 id="meLabel"></h2>
        <button id="logoutBtn" class="secondary small">Logout</button>
      </header>

      <div class="search-block">
        <input id="searchInput" placeholder="Search users (2+ chars)" />
        <ul id="searchList"></ul>
      </div>

      <section class="list-block">
        <div class="block-title-row">
          <h3>Active chats</h3>
          <button id="refreshBtn" class="secondary small">Refresh</button>
        </div>
        <ul id="chatList"></ul>
      </section>
    </aside>

    <section class="content glass">
      <header class="content-head">
        <h3>Invitations</h3>
        <p class="muted">Accept or decline incoming chat requests.</p>
      </header>
      <ul id="invitesList" class="invite-list"></ul>
    </section>
  </main>

  <script src="discover.js"></script>
</body>
</html>
